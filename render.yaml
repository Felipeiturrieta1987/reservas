# Blueprint de Render: crea la base de datos y el servicio web de una vez.
databases:
  - name: bellarium-db
    plan: free            # ⚠ la base gratis de Render vence a los 30 días: sube a un plan pago antes de usarla en serio
    region: virginia
    databaseName: bellarium
    user: bellarium

services:
  - type: web
    name: bellarium-reservas
    runtime: node
    plan: free            # ⚠ el plan gratis se "duerme" tras 15 min sin visitas (la primera clienta espera ~1 min)
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: bellarium-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false       # Render te pedirá escribirla al crear el servicio. Elígela tú; no la compartas.
      - key: SESSION_SECRET
        generateValue: true
